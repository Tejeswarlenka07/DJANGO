<!DOCTYPE html>
<html>
<head>
    <title>Attendance Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 10px;
        }

        th {
            background: #4f46e5;
            color: white;
            padding: 15px;
        }

        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f5ff;
        }

        button {
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            margin: 2px;
            color: white;
        }

        button[value="present"] {
            background: #22c55e;
        }

        button[value="absent"] {
            background: #ef4444;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📊 Student Attendance Dashboard</h1>

    <table>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Present</th>
            <th>Total</th>
            <th>Attendance</th>
            <th>Mark Attendance</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.classes_attended }}</td>
            <td>{{ student.total_classes }}</td>
            <td>{{ student.attendance_percentage }}%</td>

            <td>
                <form method="POST">
                    {% csrf_token %}

                    <input type="hidden" name="student_id" value="{{ student.id }}">

                    <button type="submit" name="status" value="present">
                        Present
                    </button>

                    <button type="submit" name="status" value="absent">
                        Absent
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
