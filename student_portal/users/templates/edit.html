<h2>Edit User</h2>

<form method="post" action="{% url 'update' user.id %}">
    {% csrf_token %}
    Username: <input type="text" name="username" value="{{ user.username }}"><br><br>
    Email: <input type="email" name="email" value="{{ user.email }}"><br><br>
    Country: <input type="text" name="country" value="{{ user.country }}"><br><br>
    <input type="submit" value="Update">
</form>

<br>
<a href="{% url 'view' %}">Back</a>
